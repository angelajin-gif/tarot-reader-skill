  - concept: choice_spread_relative_comparison
    source_pages: [229, 230, 231, 232]
    why_retrievable: 比较 A/B 的相对状况和影响，不把牌写成绝对好坏
  - concept: practice_archive_and_verification
    source_pages: [218, 243, 244, 249, 250]
    why_retrievable: 以案例档案和现实反馈改进 reading，而不是重复占卜验算
  - concept: upright_only_scope_boundary
    source_pages: [7, 55, 67, 79, 91, 104, 122]
    why_retrievable: Daniel 只提供 upright/base function；真实逆位交给 Greer
