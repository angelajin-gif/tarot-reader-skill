    "status": "ratified_global"
    "statement": "问题、时间范围和牌位先定义解释空间；有牌位先服从牌位，无牌位不得补造过去、现在或结果等位置。"
    "does_not_mean":
      - "不代表所有 readings 必须使用同一种 spread。"
      - "不代表左→右天然是时间线。"
    "scope": "Question and spread organization in every reading."
    "jurisdiction":
      - "daniel"
      - "nichols"
    "conditions":
      - "Input records a named layout or an explicit no-position state."
      - "Question and time scope are explicit or unresolved."
    "exceptions":
      - "No-position left-to-right may be a bounded candidate axis."
      - "A strong relation may become a pivot without becoming an invented position."
    "counterevidence":
      - "A user label cannot create a position."
      - "A later retrieval cannot repair a fabricated layout."
