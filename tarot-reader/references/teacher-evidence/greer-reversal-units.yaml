  upright_baseline: 权杖六（ Six of Wands ） 继权杖五的纷争之后，权杖六出现了一位胜利者或领袖，其他人 则集结在他身边支持拥护他。
    似乎也代表了正在带动某种行动风潮。 这张牌代表成功、胜利、骄傲、自主权，或进步发展，而且通常是因 为某个单一个人本身的技能和勇气所促成。 在伟特牌中，我们看到一
    名头戴桂冠的人物， “ 高高骑在马上 ” 。
  reversal_mechanism_candidates:
  - mechanism: blockage_or_resistance
    text_signals:
    - 阻碍
    - 拒绝
  - mechanism: projection
    text_signals:
    - 投射
    - 别人身上
  - mechanism: delay_or_difficulty
    text_signals:
