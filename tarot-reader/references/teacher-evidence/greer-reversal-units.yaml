    表寻回小羊之后的喜悦和庆宴。 传统解释上，这张逆 位牌代表坚持必经的过程以确保最后可以得到成功。 占满逆位牌最顶端的整排杯子，就是 “ 机会之窗 ” ，会
    有更多的东西从这里进来。
