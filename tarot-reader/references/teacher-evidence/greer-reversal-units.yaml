  upright_baseline: 命运之轮（ The Wheel of Fortune ） 命运之轮这张牌象征着我们生命每一个层面可能发生的变化、移 动、扩张和机会。
    这种变化往往突然发生，而且相当明确，事发时或 许令人兴奋，但最终结果却难以预料。 不过，有了幸运女神的参与， 情势可能会转好。 从形上学的角度来说，你可能会觉得这是命中注定
    而非偶然机遇，是共时性而非巧合所致。
