  reversal_anchor: 权杖六逆位 权杖五逆位代表可能遭受迫害和骚扰，接着，到 了权杖六逆位，代表从高处摔下来。 这是标准的 “ 特洛 伊木马 ” 牌（译注：比喻内部的破坏集团）。
    传统解释 上，它代表胜利或成功可能是短暂的。 敌人可能就在 本能寺，也许还会发生背叛或叛变。 消息或快递物件 半途遗失或被拦截，或是你遇到沟通不良的情况。
  context_switches:
