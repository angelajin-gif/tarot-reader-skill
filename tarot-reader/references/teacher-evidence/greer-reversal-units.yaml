  reversal_anchor: 命运之轮逆位 在传统解牌上，命运之轮逆位依然是对你有利的 好牌，只是比较不稳定 ── 就像在心理上玩熘熘球 ── 希望感和沮丧感不断交替起伏。
    你可能因为原本期待 的事情发生变化（例如事情反复走走停停），导致事 情的进展有所延误，或是起了一点小烦恼。 你可能感 到忧心，为新的局势做好了准备，却又受到阻碍和阻
    拦，不知接下来事情会如何发展。
  context_switches:
  - 另一种相反情况是，频繁的社交活动带来的兴奋感或生活上的一 些变化，会开始让你变得非常忙碌，而且脱不了身，就像你在跑步机 上无法停下来。
  - 如果这时候你心里有所迟疑，觉得事情发生得太快太容易，可能 会因为想要把速度放慢下来，而变得过于谨慎、死板、保守。
  - 某些解释会认为这张命运之轮逆位是代表失败和坏运，但很可能 这是跟心态有关，因为当我们认定逆位牌跟正位牌相反，这当中就已 经悄悄混进负面想法了。
  - 如果这张牌代表你对别人的投射，也许你认为他们非常幸运，一 路向上爬升，命运正在对他们微笑，但如果你继续看下去，可能会看 到他们从云端坠落。
